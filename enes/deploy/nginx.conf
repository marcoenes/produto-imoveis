# Site enes servido pelo nginx. O instalar-vps.sh troca DOMINIO pelo domínio informado
# (ou por "_" quando o site é acessado só pelo IP) e grava em /etc/nginx/sites-available/enes.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    root /var/www/enes;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Vídeo e imagens: 1 dia de cache. O nginx já responde a pedidos de trecho (Range),
    # que o navegador usa para avançar o vídeo conforme a rolagem.
    location /assets/ {
        expires 1d;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }
}
